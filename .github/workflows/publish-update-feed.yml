name: Publish Astra update feed

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  publish-update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Generate update metadata from release assets
        uses: actions/github-script@v7
        with:
          script: |
            const release = context.payload.release;
            const description = release.body || "";
            const versionCodeMatch = description.match(/^\s*Version\s*Code\s*:\s*(\d+)\s*$/im);

            if (!versionCodeMatch) {
              throw new Error(
                "Release description must include a line like: Version Code: 200054"
              );
            }

            const apkAssets = (release.assets || []).filter(asset =>
              asset.name.toLowerCase().endsWith(".apk")
            );

            if (apkAssets.length === 0) {
              throw new Error("No APK assets found in this release.");
            }

            function getArch(name) {
              const lower = name.toLowerCase();
              if (lower.includes("arm64-v8a") || lower.includes("arm64")) return "arm64";
              if (lower.includes("armeabi-v7a") || lower.includes("arm32")) return "arm";
              if (lower.includes("x86_64")) return "x86_64";
              if (lower.includes("x86")) return "x86";
              return "all";
            }

            const files = apkAssets.map(asset => ({
              file_name: asset.name,
              uri: asset.browser_download_url,
              arch: getArch(asset.name),
              size: asset.size
            }));

            const changelog = description
              .replace(versionCodeMatch[0], "")
              .trim() || "Astra Launcher update.";

            const feed = {
              code: Number(versionCodeMatch[1]),
              version: release.name || release.tag_name,
              created_at: release.published_at || release.created_at,
              default_cloud_drive: null,
              cloud_drives: [],
              files,
              default_body: {
                language: "en-US",
                markdown: changelog
              },
              bodies: [
                { language: "en-US", markdown: changelog }
              ]
            };

            const { owner, repo } = context.repo;
            const path = "latest_version_md.json";
            const content = Buffer
              .from(JSON.stringify(feed, null, 2) + "\n")
              .toString("base64");

            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: "main"
              });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: "main",
              message: "Update Astra feed for " + release.tag_name,
              content,
              ...(sha ? { sha } : {})
            });

            core.info("Published " + files.length + " APK(s) for " + feed.version + " (versionCode " + feed.code + ").");
